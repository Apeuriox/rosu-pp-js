[package]
name = "rosu-pp-js"
version = "4.0.1"
edition = "2021"
authors = ["MaxOhn <ohn.m@hotmail.de>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Apeuriox/rosu-pp-js"
description = "Difficulty and performance calculation for osu! (Apeuriox/rosu-pp wasm bindings)"
keywords = ["osu", "pp", "stars", "performance", "difficulty"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "=0.3.72"
rosu-mods = { version = "0.4.1", default-features = false, features = ["serde"] }
# Sibling checkout: X:\rosu-pp (Apeuriox/rosu-pp main)
rosu-pp = { path = "../../../rosu-pp" }
serde = { version = "1.0.197", features = ["derive"] }
wasm-bindgen = "=0.2.95"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

# https://github.com/rustwasm/wasm-pack/issues/1501#issuecomment-2898697188
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true
